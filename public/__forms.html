<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="events-studio-form-definition" content="true">
  <title>Modulo contatti — Events Studio</title>
</head>
<body>
  <!-- Definition for Netlify's deployment scanner; the visible form is /contatti. -->
  <form name="events-studio-contatti" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
    <input type="hidden" name="form-name" value="events-studio-contatti">
    <input name="nome"><input name="cognome"><input name="telefono">
    <input name="email" type="email"><input name="tipologia"><input name="data">
    <input name="location"><textarea name="messaggio"></textarea>
    <input name="privacy"><input name="website"><input name="richiesta">
    <input name="informativa"><input name="versioneInformativa"><input name="ricevutaIl">
  </form>
  <p>Per contattare Events Studio visita la <a href="/contatti">pagina Contattaci</a>.</p>
</body>
</html>
